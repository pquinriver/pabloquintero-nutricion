<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}{% if page.title %} · {% endif %}Pablo Quintero — Nutrición</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
{% if page.noindex %}<meta name="robots" content="noindex, follow">{% endif %}
<meta name="theme-color" content="#0f3631">
<link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">

<meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
<meta property="og:locale" content="es_ES">
<meta property="og:site_name" content="Pablo Quintero — Nutrición">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ '/assets/pablo.png' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | default: site.title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ '/assets/pablo.png' | absolute_url }}">

<link rel="alternate" type="application/atom+xml" title="Pablo Quintero — Blog" href="{{ '/feed.xml' | absolute_url }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/styles.css' | relative_url }}">
