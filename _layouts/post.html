---
layout: default
---
<article class="section post">
  <p class="eyebrow-note"><a href="{{ '/blog/' | relative_url }}" style="color:inherit;">Blog</a></p>
  <h1 style="font-size:clamp(1.9rem,3.8vw,2.8rem);max-width:760px;">{{ page.title }}</h1>
  <p class="post-meta">{% include fecha-es.html date=page.date %}{% if page.author %} · {{ page.author }}{% endif %}</p>

  <div class="post-content">
    {{ content }}
  </div>

  {% include subscribe.html %}
</article>
